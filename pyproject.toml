[project]
name = "iambizzy"
version = "0.1.0"
description = "Keep availability in sync across calendars"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
  "Django>=5.2.8,<5.3",
  "dj-database-url>=3,<4",
  "psycopg[binary]>=3.2,<4",
  "requests>=2.32,<3",
  "cryptography>=45",
  "icalendar>=6.3,<8",
  "recurring-ical-events>=3.8,<4",
  "waitress>=3,<4",
  "whitenoise>=6.8,<7",
]
[dependency-groups]
dev = ["ruff>=0.12"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
